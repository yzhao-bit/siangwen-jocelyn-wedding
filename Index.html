<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烧乌龟 · Burn the Turtle</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 50% 15%, #fff8e8 0, #f5ead2 38%, #d8c5a3 100%);
    color: #24170f;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 14px 34px;
    text-align: center;
    user-select: none;
  }

  h1 {
    margin: 4px 0 2px;
    font-size: clamp(30px, 8vw, 54px);
    letter-spacing: 3px;
  }

  .subtitle {
    margin: 0 0 12px;
    font-size: 14px;
    opacity: .72;
    letter-spacing: 1px;
  }

  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 12px;
  }

  .stat {
    min-width: 118px;
    padding: 8px 16px;
    border: 1px solid rgba(50,30,15,.18);
    border-radius: 999px;
    background: rgba(255,255,255,.42);
  }

  .stat strong {
    display: block;
    font-size: 23px;
    line-height: 1.05;
  }

  .stat span {
    font-size: 11px;
    opacity: .62;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .scene {
    position: relative;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    width: min(560px, 96vw);
    height: 500px;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* Paper */
  .paper {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 24px;
    width: 245px;
    height: 165px;
    transform: translateX(-50%) rotate(-4deg);
    background:
      repeating-linear-gradient(
        transparent 0 27px,
        rgba(70,110,150,.12) 28px 29px
      ),
      #fffdf6;
    box-shadow: 0 8px 18px rgba(50,25,10,.22);
    border: 1px solid #d6cbb7;
    transition: opacity .15s;
  }

  .paper::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 65%, rgba(0,0,0,.045));
    pointer-events: none;
  }

  .turtle {
    position: absolute;
    inset: 20px 15px 10px;
  }

  .turtle path, .turtle ellipse, .turtle circle {
    fill: none;
    stroke: #111;
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .scribble {
    position: absolute;
    left: 50%;
    top: 9px;
    transform: translateX(-50%) rotate(-5deg);
    font: bold 13px "Comic Sans MS", cursive;
    color: #333;
  }

  /* Pot */
  .pot-area {
    position: absolute;
    left: 50%;
    bottom: 24px;
    width: 280px;
    height: 275px;
    transform: translateX(-50%);
  }

  .flame-wrap {
    position: absolute;
    z-index: 3;
    left: 50%;
    bottom: 137px;
    width: 225px;
    height: 215px;
    transform: translateX(-50%);
    filter: drop-shadow(0 0 14px rgba(255,100,0,.45));
  }

  .flame {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 112px;
    height: 190px;
    transform: translateX(-50%);
    background: linear-gradient(to top, #ff4b00, #ff9d00 55%, #ffd34e);
    clip-path: polygon(50% 0, 68% 24%, 83% 43%, 100% 65%, 82% 100%, 53% 91%, 27% 100%, 0 68%, 19% 44%, 34% 28%);
    animation: bigFlame .65s ease-in-out infinite alternate;
    transform-origin: 50% 100%;
  }

  .flame::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 4px;
    width: 72px;
    height: 143px;
    transform: translateX(-50%);
    background: linear-gradient(to top, #ffb300, #ffe36a 70%, #fff4b0);
    clip-path: polygon(50% 0, 76% 34%, 100% 62%, 78% 100%, 49% 90%, 19% 100%, 0 64%, 28% 33%);
  }

  .flame::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 5px;
    width: 35px;
    height: 90px;
    transform: translateX(-50%);
    background: #fff9d6;
    clip-path: polygon(50% 0, 86% 54%, 72% 100%, 29% 100%, 10% 56%);
  }

  .flame.small {
    width: 65px;
    height: 125px;
    opacity: .9;
    bottom: 8px;
    animation: sideFlame .5s ease-in-out infinite alternate;
  }
  .flame.small.left { margin-left: -78px; transform: rotate(-15deg); }
  .flame.small.right { margin-left: 78px; transform: rotate(15deg); }

  .spark {
    position: absolute;
    z-index: 8;
    width: 5px;
    height: 10px;
    border-radius: 50%;
    background: #ffd76a;
    box-shadow: 0 0 7px #ff8a00;
    animation: spark 1.5s linear infinite;
  }
  .spark.s1 { left: 34%; bottom: 205px; animation-delay: -.2s; }
  .spark.s2 { left: 63%; bottom: 225px; animation-delay: -.8s; }
  .spark.s3 { left: 47%; bottom: 250px; animation-delay: -1.1s; }

  .pot {
    position: absolute;
    z-index: 5;
    left: 50%;
    bottom: 0;
    width: 245px;
    height: 145px;
    transform: translateX(-50%);
    background: linear-gradient(#33251f 0 15%, #4a3529 16% 100%);
    border-radius: 12px 12px 58px 58px / 18px 18px 42px 42px;
    box-shadow: inset 0 -18px 25px rgba(0,0,0,.3), 0 10px 15px rgba(0,0,0,.22);
  }

  .pot-rim {
    position: absolute;
    z-index: 7;
    left: 50%;
    top: -12px;
    width: 275px;
    height: 34px;
    transform: translateX(-50%);
    background: #241a16;
    border-radius: 50%;
    box-shadow: inset 0 7px 7px rgba(255,160,60,.15);
  }

  .pot-rim::after {
    content: "";
    position: absolute;
    inset: 7px 16px 9px;
    border-radius: 50%;
    background: #090807;
    box-shadow: 0 0 14px rgba(255,99,0,.55);
  }

  .pot-handle {
    position: absolute;
    top: 31px;
    width: 55px;
    height: 65px;
    border: 15px solid #382920;
    border-radius: 50%;
    z-index: -1;
  }
  .pot-handle.left { left: -30px; }
  .pot-handle.right { right: -30px; }

  /* Smoke */
  .smoke {
    position: absolute;
    left: 50%;
    bottom: 270px;
    width: 12px;
    height: 12px;
    background: rgba(80,75,68,.22);
    border-radius: 50%;
    animation: smoke 3s ease-out infinite;
  }
  .smoke:nth-child(2) { animation-delay: 1s; margin-left: -30px; }
  .smoke:nth-child(3) { animation-delay: 2s; margin-left: 30px; }

  .plus {
    position: absolute;
    z-index: 10;
    left: 50%;
    bottom: 290px;
    transform: translateX(-50%);
    font: 900 34px Arial, sans-serif;
    color: #d94a00;
    text-shadow: 0 2px 0 #fff5dc;
    pointer-events: none;
    animation: plus 900ms ease-out forwards;
  }

  .instructions {
    max-width: 440px;
    margin: -2px auto 14px;
    font-size: 15px;
    opacity: .75;
  }

  button {
    min-height: 48px;
    padding: 11px 24px;
    border: 0;
    border-radius: 999px;
    background: #2d211b;
    color: #fff7e7;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #120d0a;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #120d0a;
  }

  .burning {
    animation: burnPaper 1050ms cubic-bezier(.45,.05,.55,.95) forwards !important;
  }

  .paper.new-paper {
    animation: paperArrive .35s ease-out both;
  }

  @keyframes bigFlame {
    from { transform: translateX(-50%) scaleX(.91) scaleY(.96) rotate(-3deg); }
    to   { transform: translateX(-50%) scaleX(1.08) scaleY(1.06) rotate(4deg); }
  }

  @keyframes sideFlame {
    from { transform: scaleY(.88) rotate(-16deg); }
    to   { transform: scaleY(1.12) rotate(-7deg); }
  }

  @keyframes spark {
    0% { opacity: 0; transform: translate(0, 10px) scale(.6); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(18px, -110px) scale(.15); }
  }

  @keyframes smoke {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.5); }
    20%  { opacity: .45; }
    100% { opacity: 0; transform: translate(-85px, -155px) scale(3.5); }
  }

  @keyframes burnPaper {
    0%   { opacity: 1; transform: translateX(-50%) rotate(-4deg) scale(1); filter: none; }
    28%  { opacity: 1; transform: translateX(-50%) translateY(65px) rotate(7deg) scale(.92); filter: sepia(.5) saturate(1.5); }
    60%  { opacity: .9; transform: translateX(-50%) translateY(165px) rotate(-7deg) scale(.68); filter: sepia(1) saturate(4) brightness(.8); }
    82%  { opacity: .55; transform: translateX(-50%) translateY(235px) rotate(13deg) scale(.4); filter: sepia(1) saturate(5) brightness(.4); }
    100% { opacity: 0; transform: translateX(-50%) translateY(285px) rotate(25deg) scale(.08); filter: brightness(0); }
  }

  @keyframes paperArrive {
    from { opacity: 0; transform: translateX(-50%) translateY(-14px) rotate(-10deg) scale(.96); }
    to   { opacity: 1; transform: translateX(-50%) rotate(-4deg) scale(1); }
  }

  @keyframes plus {
    0%   { opacity: 0; transform: translate(-50%, 15px) scale(.6); }
    25%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .flame, .flame.small, .smoke, .spark { animation: none; }
    .burning { animation: none !important; opacity: 0 !important; }
    .plus { animation: none; opacity: 1; }
  }

  @media (max-width: 420px) {
    .scene { height: 455px; }
    .paper { width: 215px; height: 145px; }
    .pot-area { transform: translateX(-50%) scale(.86); transform-origin: bottom center; }
    .flame-wrap { transform: translateX(-50%) scale(.86); }
  }
  .scene * { -webkit-tap-highlight-color: transparent; }
  .effects, .plus, .smoke, .spark, .flame-wrap, .flame, .pot,
  .pot-rim, .pot-handle, .paper::before, .turtle, .scribble {
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="page" id="app">
  <h1>烧乌龟</h1>
  <p class="subtitle">WEDDING EDITION · SIANG WEN &amp; JOCELYN</p>

  <div class="stats" aria-live="polite">
    <div class="stat">
      <strong id="burnCount">0</strong>
      <span>turtles burnt</span>
    </div>
  </div>

  <p class="instructions">🔥 TAP ANYWHERE TO BURN THE TURTLE 🔥</p>

  <div class="scene" id="scene" aria-label="Tap to burn the turtle paper">
    <div class="paper" id="paper">
      <div class="scribble">my turtle 🐢</div>
      <svg class="turtle" viewBox="0 0 220 130" aria-label="cute black and white turtle drawing">
        <!-- shell -->
        <ellipse cx="105" cy="68" rx="67" ry="38"/>
        <path d="M51 68 C60 41, 78 30, 105 30 C133 30, 151 42, 160 68"/>
        <path d="M51 68 C61 95, 82 106, 105 106 C130 106, 151 94, 160 68"/>
        <!-- shell pattern -->
        <path d="M105 31 C91 42, 91 57, 105 68 C119 57, 119 42, 105 31Z"/>
        <path d="M105 68 C91 79, 91 94, 105 105 C119 94, 119 79, 105 68Z"/>
        <path d="M51 68 C67 60, 82 60, 105 68 C82 76, 67 76, 51 68Z"/>
        <path d="M105 68 C128 60, 143 60, 160 68 C143 76, 128 76, 105 68Z"/>
        <!-- head -->
        <path d="M159 68 C169 51, 190 50, 199 63 C207 74, 198 88, 184 89 C172 90, 164 82, 159 68Z"/>
        <circle cx="190" cy="64" r="3" fill="#111"/>
        <path d="M198 75 Q204 77 208 74"/>
        <!-- legs -->
        <path d="M68 94 C56 100, 54 112, 64 115 C72 117, 78 108, 80 99"/>
        <path d="M135 96 C147 101, 151 112, 141 115 C133 117, 127 108, 125 99"/>
        <!-- tail -->
        <path d="M49 72 C38 70, 30 75, 35 82 C39 87, 46 82, 53 77"/>
        <!-- little hatch lines -->
        <path d="M78 42 l-7 -7 M88 36 l-4 -9 M121 36 l4 -9 M132 42 l7 -7"/>
      </svg>
    </div>

    <div class="pot-area">
      <div class="smoke"></div>
      <div class="smoke"></div>
      <div class="smoke"></div>

      <div class="flame-wrap">
        <div class="flame small left"></div>
        <div class="flame"></div>
        <div class="flame small right"></div>
      </div>
      <div class="spark s1"></div>
      <div class="spark s2"></div>
      <div class="spark s3"></div>

      <div class="pot">
        <div class="pot-handle left"></div>
        <div class="pot-handle right"></div>
        <div class="pot-rim"></div>
      </div>
    </div>

    <div id="effects" aria-hidden="true"></div>
  </div>

  <button id="burnButton" type="button">🔥 Burn Turtle</button>
</div>

<script>
(function () {
  "use strict";

  var root = document.getElementById("app");
  var scene = document.getElementById("scene");
  var paper = document.getElementById("paper");
  var effects = document.getElementById("effects");
  var button = document.getElementById("burnButton");
  var count = document.getElementById("burnCount");
  var busy = false;

  function plusOne() {
    var el = document.createElement("div");
    el.className = "plus";
    el.textContent = "+1";
    effects.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 1000);
  }

  function resetPaper() {
    paper.classList.remove("burning");
    paper.classList.add("new-paper");
    paper.style.opacity = "0";

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        paper.style.opacity = "";
        setTimeout(function () {
          paper.classList.remove("new-paper");
        }, 400);
      });
    });
  }

  function burn() {
    if (busy) return;
    busy = true;

    var n = parseInt(count.textContent, 10) || 0;
    count.textContent = String(n + 1);
    plusOne();

    paper.classList.remove("new-paper", "burning");
    paper.style.animation = "none";
    void paper.offsetWidth;
    paper.style.animation = "";
    paper.classList.add("burning");

    setTimeout(function () {
      resetPaper();
      busy = false;
    }, 1100);
  }

  // A single delegated click handler works on desktop and normal iOS Safari.
  root.addEventListener("click", function (event) {
    if (button.contains(event.target) || scene.contains(event.target)) {
      burn();
    }
  });

  // iPhone fallback: touchend directly triggers the same action.
  // Prevents Safari's delayed synthetic click from causing a second burn.
  root.addEventListener("touchend", function (event) {
    if (!button.contains(event.target) && !scene.contains(event.target)) return;
    event.preventDefault();
    burn();
  }, { passive: false });

  count.textContent = "0";
})();
</script>
</body>
</html>
